# Netlify: connect the repository, no other settings needed.
[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @solar-sim/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed bundles never change; the page, manifest and service worker must always revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
